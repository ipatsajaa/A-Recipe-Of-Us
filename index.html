<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diner Dash: Mie Nyemek Master ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; background: #2c3e50; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 0; width: 100%; pointer-events: none; z-index: 10; padding: 15px; box-sizing: border-box; display: flex; justify-content: space-between; color: #fff; font-weight: bold; font-size: 1.2rem; text-shadow: 2px 2px #000; }
        #overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 20px; text-align: center; width: 80%; display: none; border: 5px solid #ff4d6d; z-index: 1000; }
        .btn { background: #ff4d6d; color: white; padding: 12px 25px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; pointer-events: auto; }
    </style>
</head>
<body>

<div id="ui">
    <div>⭐ <span id="score">0</span></div>
    <div>⏱️ <span id="timer">115</span>s</div>
</div>

<div id="overlay">
    <h2 id="msg-title">SHIFT SELESAI!</h2>
    <p id="msg-desc"></p>
    <button class="btn" onclick="location.reload()">MAIN LAGI</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Supaya gambar pixel art tetap tajam (tidak blur)
    ctx.imageSmoothingEnabled = false;

    const imgData = {
        bg: "img/floor_tile.png", // Gambar lantai bunga hijau
        player: "img/player_pixel.png", // Karakter utama
        customer: "img/nathan_pixel.png", // Karakter Nathan di meja
        monkey: "img/monkey_pixel.png", // Monyet penghalang
        fridge: "img/fridge.png", // Kulkas (Pantry)
        dispenser: "img/dispenser.png", // Dispenser minuman
        stove: "img/stove_area.png", // Meja kompor panjang
        table: "img/table_pixel.png", // Meja makan
        trash: "img/trash_pixel.png", // Tong sampah
        bubble: "img/thought_bubble.png", // Gelembung pesan
        mie: "img/mie_nyemek.png", // Item mie
        drink: "img/drink_item.png" // Item minum
    };

    const images = {};
    const imgStatus = {};
    for (let key in imgData) {
        images[key] = new Image();
        images[key].onload = () => { imgStatus[key] = true; };
        images[key].src = imgData[key];
    }

    let score = 0, time = 115, gameActive = true, state = "idle";
    let orders = ["🥘", "🥤", "🥘"]; 
    let currentOrderIdx = 0;

    const player = { x: canvas.width - 100, y: canvas.height - 150, speed: 0.25, stunned: 0 };
    const target = { x: player.x, y: player.y };

    // Posisi Stasiun (Sesuai Layout Gambar Kamu)
    const stations = {
        pantry: { x: 10, y: canvas.height - 180, w: 80, h: 160, type: 'fridge' },
        dispenser: { x: 100, y: canvas.height - 160, w: 80, h: 140, type: 'dispenser', prg: 0 },
        stove: { x: 10, y: canvas.height - 280, w: 250, h: 100, type: 'stove', prg: 0 },
        table: { x: canvas.width/2 - 60, y: 200, w: 120, h: 120, type: 'table' },
        trash: { x: canvas.width - 80, y: canvas.height - 80, w: 60, h: 70, type: 'trash' }
    };

    const hazards = [
        { x: 50, y: 350, vx: 3, w: 60, h: 60 },
        { x: canvas.width - 100, y: 500, vx: -3, w: 60, h: 60 }
    ];

    canvas.addEventListener('touchstart', (e) => {
        if(!gameActive || player.stunned > 0) return;
        target.x = e.touches[0].clientX;
        target.y = e.touches[0].clientY;
    });

    function update() {
        if (!gameActive) return;
        if (player.stunned > 0) player.stunned--;
        else {
            player.x += (target.x - player.x) * player.speed;
            player.y += (target.y - player.y) * player.speed;
        }

        // Cek Interaksi Stasiun
        for (let key in stations) {
            let s = stations[key];
            let dist = Math.hypot(player.x - (s.x + s.w/2), player.y - (s.y + s.h/2));
            if (dist < 70 && player.stunned === 0) {
                if (key === 'pantry' && state === "idle") state = "carrying_raw";
                if (key === 'trash' && state !== "idle") state = "idle";
                if (key === 'stove' && state === "carrying_raw") {
                    s.prg += 1.5;
                    if (s.prg >= 100) { state = "carrying_food"; s.prg = 0; }
                } else if (key !== 'stove') { stations.stove.prg = 0; }
                if (key === 'dispenser' && state === "idle") {
                    s.prg += 3.0;
                    if (s.prg >= 100) { state = "carrying_drink"; s.prg = 0; }
                } else if (key !== 'dispenser') { stations.dispenser.prg = 0; }
                if (key === 'table') {
                    let needed = orders[currentOrderIdx];
                    if ((state === "carrying_food" && needed === "🥘") || (state === "carrying_drink" && needed === "🥤")) {
                        state = "idle"; score += 20; currentOrderIdx++;
                        document.getElementById('score').innerText = score;
                        if(currentOrderIdx >= orders.length) endGame(true);
                    }
                }
            }
        }
        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Background Tile
        if (imgStatus.bg) {
            let pattern = ctx.createPattern(images.bg, 'repeat');
            ctx.fillStyle = pattern;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 2. Render Stations (Kulkas, Dispenser, Kompor, dsb)
        for (let key in stations) {
            let s = stations[key];
            if(imgStatus[s.type]) ctx.drawImage(images[s.type], s.x, s.y, s.w, s.h);
            if(s.prg > 0) { // Progress Bar
                ctx.fillStyle = "white"; ctx.fillRect(s.x, s.y - 20, s.w, 10);
                ctx.fillStyle = "#ff4d6d"; ctx.fillRect(s.x, s.y - 20, (s.prg/100)*s.w, 10);
            }
        }

        // 3. Render Nathan di Meja & Bubble Pesanan
        if(imgStatus.customer) ctx.drawImage(images.customer, canvas.width/2 - 40, 140, 80, 80);
        if(currentOrderIdx < orders.length) {
            if(imgStatus.bubble) ctx.drawImage(images.bubble, canvas.width/2 + 30, 100, 70, 70);
            ctx.fillText(orders[currentOrderIdx], canvas.width/2 + 65, 145);
        }

        // 4. Hazards (Monyet)
        hazards.forEach(h => {
            h.x += h.vx;
            if (h.x < 0 || h.x > canvas.width - h.w) h.vx *= -1;
            if(imgStatus.monkey) ctx.drawImage(images.monkey, h.x, h.y, h.w, h.h);
            if (Math.hypot(player.x - (h.x + h.w/2), player.y - (h.y + h.h/2)) < 40 && player.stunned === 0) {
                player.stunned = 60; state = "idle";
            }
        });

        // 5. Player & Item yang dibawa
        if(imgStatus.player) {
            ctx.save();
            if(player.stunned > 0) ctx.globalAlpha = 0.5;
            ctx.drawImage(images.player, player.x - 45, player.y - 45, 90, 90);
            
            // Render item di tangan player
            let item = state === "carrying_food" ? images.mie : (state === "carrying_drink" ? images.drink : null);
            if(item && imgStatus[Object.keys(imgData).find(k => images[k] === item)]) {
                ctx.drawImage(item, player.x - 20, player.y - 90, 40, 40);
            }
            ctx.restore();
        }
    }

    function endGame(win) {
        gameActive = false;
        document.getElementById('overlay').style.display = "block";
        document.getElementById('msg-title').innerText = win ? "BERHASIL! 🏆" : "WAKTU HABIS!";
        document.getElementById('msg-desc').innerText = win ? "Nathan kenyang!" : "Coba lagi!";
    }

    setInterval(() => { if(gameActive) { time--; document.getElementById('timer').innerText = time; if(time <= 0) endGame(false); } }, 1000);
    update();
</script>
</body>
</html>
