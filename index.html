<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Recipe Of Us - Main Menu</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: url('img/menu_bg.png') no-repeat center center fixed; 
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
        }

        #menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 15px;
        }

        .logo {
            width: 80%;
            max-width: 400px;
            margin-bottom: 30px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        /* Tombol Utama (Berbentuk memanjang seperti di gambar) */
        .btn-img {
            width: 250px;
            cursor: pointer;
            transition: transform 0.1s;
            display: block;
        }

        .btn-img:active {
            transform: scale(0.9);
        }

        /* Baris Tombol Kecil di Bawah */
        .bottom-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-small {
            width: 60px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-small:active {
            transform: scale(0.85);
        }
    </style>
</head>
<body>

<div id="menu-container">
    <img src="img/logo_game.png" class="logo" alt="Logo Game">

    <a href="chef.html">
        <img src="img/btn_play.png" class="btn-img" alt="Play">
    </a>
    <img src="img/btn_survival.png" class="btn-img" alt="Survival">
    <img src="img/btn_store.png" class="btn-img" alt="Store">
    <img src="img/btn_other_games.png" class="btn-img" alt="Other Games">

    <div class="bottom-row">
        <img src="img/icon_share.png" class="btn-small">
        <img src="img/icon_trophy.png" class="btn-small">
        <img src="img/icon_rank.png" class="btn-small">
        <img src="img/icon_settings.png" class="btn-small">
        <img src="img/icon_more.png" class="btn-small">
    </div>
</div>

</body>
</html>
